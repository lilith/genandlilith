<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genevieve & Lilith - July 9, 2026</title>
  <meta name="description" content="Wedding celebration of Genevieve and Lilith - July 9, 2026 in Estes Park, Colorado">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #333132;
      --cream: #f5f0eb;
      --gold: #d4af8e;
      --gold-5: rgba(212,175,142,0.05);
      --gold-8: rgba(212,175,142,0.08);
      --gold-50: rgba(212,175,142,0.5);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    /* ── Nav ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(51,49,50,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--gold);
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--cream);
      text-decoration: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    nav a:hover,
    nav a.active {
      color: var(--gold);
    }

    /* ── Hero ── */
    #hero {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg);
      overflow: hidden;
    }

    #hero .hero-bg {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.35;
    }

    #hero .hero-gradient {
      position: absolute;
      inset: 0;
      background: none;
    }

    #hero.has-image .hero-gradient {
      background: linear-gradient(to bottom, rgba(51,49,50,0.3) 0%, rgba(51,49,50,0.6) 100%);
    }

    #hero .hero-content {
      position: relative;
      z-index: 2;
    }

    #hero h1 {
      font-family: 'Bellefair', serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 400;
      letter-spacing: 3px;
      color: var(--cream);
      margin-bottom: 1rem;
    }

    #hero .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: var(--gold);
    }

    /* ── Floral Background Wrapper ── */
    .floral-bg {
      background: url('assets/floral-bg-4000px-q85.webp') top center / cover no-repeat fixed;
    }

    @media (max-width: 768px) {
      .floral-bg {
        background-attachment: scroll;
      }
    }

    /* ── Content Sections ── */
    .section {
      background: rgba(51,49,50,0.88);
      padding: 5rem 2rem;
    }

    .section-inner {
      max-width: 850px;
      margin: 0 auto;
    }

    .section-inner.fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .section-inner.fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section + .section {
      border-top: 1px solid rgba(212,175,142,0.25);
    }

    h2 {
      font-family: 'Bellefair', serif;
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-align: center;
      color: var(--cream);
      margin-bottom: 2rem;
    }

    h3 {
      font-family: 'Bellefair', serif;
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--cream);
      margin-bottom: 1rem;
    }

    p {
      margin-bottom: 1.2rem;
    }

    a {
      color: var(--gold);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      background: var(--gold);
      color: var(--bg);
      padding: 0.75rem 2rem;
      border-radius: 2px;
      font-weight: 600;
      letter-spacing: 1px;
      font-family: 'Cormorant Garamond', serif;
      text-decoration: none;
      font-size: 1.1rem;
      transition: background 0.3s;
    }

    .btn:hover {
      background: var(--cream);
    }

    /* ── Welcome ── */
    .welcome-photo {
      display: block;
      max-width: 100%;
      border-radius: 4px;
      margin: 2rem auto;
    }

    /* ── Schedule ── */
    .schedule-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .schedule-header .date {
      font-size: 1.3rem;
      color: var(--gold);
      font-weight: 600;
    }

    .schedule-header .venue {
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    .attire-box {
      border: 1px solid var(--gold);
      border-radius: 2px;
      padding: 1.5rem 2rem;
      margin: 2rem 0;
    }

    .attire-box h3 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .schedule-item {
      background: var(--gold-5);
      border-left: 3px solid var(--gold);
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .schedule-item .time {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 0.3rem;
    }

    /* ── Travel ── */
    .venue-card {
      background: var(--gold-8);
      padding: 1.5rem 2rem;
      border-radius: 2px;
      margin-bottom: 1.5rem;
    }

    .venue-card h3 {
      font-size: 1.5rem;
    }

    .venue-card .address {
      color: var(--gold);
      font-size: 1rem;
    }

    /* ── Story ── */
    #story p {
      text-align: left;
    }

    /* ── Gallery ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 2rem;
    }

    .gallery-item {
      cursor: pointer;
      overflow: hidden;
      border-radius: 4px;
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .gallery-item .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(51,49,50,0.85));
      padding: 2rem 1rem 1rem;
      font-size: 0.95rem;
      color: var(--cream);
      text-align: center;
    }

    @media (max-width: 500px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
    }

    /* ── FAQs ── */
    .faq-item {
      border-bottom: 1px solid var(--gold-50);
      padding: 1.2rem 0;
    }

    .faq-question {
      font-family: 'Bellefair', serif;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--cream);
    }

    .faq-question::after {
      content: '+';
      font-size: 1.5rem;
      color: var(--gold);
      transition: transform 0.3s;
    }

    .faq-item.open .faq-question::after {
      content: '\2212';
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      padding-top: 0;
    }

    .faq-item.open .faq-answer {
      max-height: 500px;
      opacity: 1;
      padding-top: 1rem;
    }

    /* ── Footer ── */
    footer {
      background: rgba(51,49,50,0.88);
      border-top: 1px solid rgba(212,175,142,0.25);
      text-align: center;
      padding: 3rem 2rem;
      font-family: 'Bellefair', serif;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: var(--gold);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      nav {
        gap: 1rem;
        padding: 0.8rem 1rem;
      }

      nav a {
        font-size: 0.85rem;
      }

      .section {
        padding: 3rem 1.2rem;
      }

      h2 {
        font-size: 2.2rem;
      }

      .gallery-grid {
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <a href="#hero">Home</a>
    <a href="#schedule">Schedule</a>
    <a href="#travel">Travel</a>
    <a href="#story">Our Story</a>
    <a href="#gallery">Gallery</a>
    <a href="#faqs">FAQs</a>
  </nav>

  <!-- Hero -->
  <section id="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <h1 id="hero-title"></h1>
      <p class="subtitle" id="hero-subtitle"></p>
    </div>
  </section>

  <!-- Floral Background Wrapper -->
  <div class="floral-bg">

    <!-- Welcome -->
    <section id="welcome" class="section">
      <div class="section-inner fade-in">
        <h2>Welcome</h2>
        <div id="welcome-intro"></div>
        <img src="" alt="Gen and Lilith" class="welcome-photo" id="welcome-photo">
        <div id="welcome-details"></div>
      </div>
    </section>

    <!-- Schedule -->
    <section id="schedule" class="section">
      <div class="section-inner fade-in">
        <h2>Schedule</h2>
        <div class="schedule-header">
          <h3>Wedding Day</h3>
          <p class="date" id="wedding-date"></p>
          <p class="venue"><span id="venue-name"></span><br><span id="venue-address"></span></p>
        </div>
        <div class="attire-box">
          <h3>Attire: Formal Garden Party</h3>
          <div id="attire-desc"></div>
        </div>
        <div id="schedule-items"></div>
      </div>
    </section>

    <!-- Travel -->
    <section id="travel" class="section">
      <div class="section-inner fade-in">
        <h2>Travel &amp; Accommodations</h2>
        <div class="venue-card">
          <h3>Lodging</h3>
          <p id="lodging-name"></p>
          <p class="address"><span id="lodging-address"></span><br>Phone: <span id="lodging-phone"></span></p>
        </div>
        <h3>Before &amp; After the Wedding</h3>
        <div id="travel-before-after"></div>
        <h3>Share Your Info</h3>
        <div id="share-info-text"></div>
        <p style="text-align: center; margin-top: 1.5rem;">
          <a id="address-btn" href="#" class="btn" target="_blank" rel="noopener">UPDATE ADDRESS</a>
        </p>
      </div>
    </section>

    <!-- Our Story -->
    <section id="story" class="section">
      <div class="section-inner fade-in">
        <h2>Our Story</h2>
        <div id="story-content"></div>
      </div>
    </section>

    <!-- Gallery -->
    <section id="gallery" class="section">
      <div class="section-inner fade-in">
        <h2>Gallery</h2>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
      <img src="" alt="Gallery photo enlarged">
    </div>

    <!-- FAQs -->
    <section id="faqs" class="section">
      <div class="section-inner fade-in">
        <h2>FAQs</h2>
        <div id="faq-list"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <span id="footer-text"></span>
    </footer>

  </div><!-- /.floral-bg -->

  <script>
    /* Minimal markdown: paragraphs, **bold**, *italic*, [links](url) */
    function md(text) {
      if (!text) return '';
      var escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var linked = escaped.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      var styled = linked.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
      var paragraphs = styled.split(/\n\n+/);
      return paragraphs.map(function(p) { return '<p>' + p.replace(/\n/g, '<br>') + '</p>'; }).join('');
    }

    function load(path) {
      return fetch(path).then(function(r) { return r.json(); });
    }

    Promise.all([
      load('content/hero.json'),
      load('content/welcome.json'),
      load('content/schedule.json'),
      load('content/travel.json'),
      load('content/story.json'),
      load('content/gallery.json'),
      load('content/faqs.json')
    ]).then(function(data) {
      var hero = data[0], welcome = data[1], sched = data[2],
          travel = data[3], story = data[4], gallery = data[5], faqs = data[6];

      /* Hero & Footer */
      document.getElementById('hero-title').textContent = hero.title;
      document.getElementById('hero-subtitle').textContent = hero.subtitle;
      if (hero.image) {
        var testImg = new Image();
        testImg.onload = function() {
          document.getElementById('hero-bg').style.backgroundImage = "url('" + hero.image + "')";
          document.getElementById('hero').classList.add('has-image');
        };
        testImg.src = hero.image;
      }
      document.getElementById('footer-text').textContent = hero.footer_text;

      /* Welcome */
      document.getElementById('welcome-intro').innerHTML = md(welcome.intro);
      document.getElementById('welcome-details').innerHTML = md(welcome.details);
      if (welcome.photo) {
        document.getElementById('welcome-photo').src = welcome.photo;
      }

      /* Schedule */
      document.getElementById('wedding-date').textContent = sched.wedding_date;
      document.getElementById('venue-name').textContent = sched.venue_name;
      document.getElementById('venue-address').textContent = sched.venue_address;
      document.getElementById('attire-desc').innerHTML = md(sched.attire_description);

      var scheduleHTML = '';
      sched.events.forEach(function(item) {
        scheduleHTML += '<div class="schedule-item">' +
          '<p class="time">' + item.time + '</p>' +
          md(item.description) + '</div>';
      });
      document.getElementById('schedule-items').innerHTML = scheduleHTML;

      /* Travel */
      document.getElementById('lodging-name').textContent = travel.lodging_name;
      document.getElementById('lodging-address').textContent = travel.lodging_address;
      document.getElementById('lodging-phone').textContent = travel.lodging_phone;
      document.getElementById('travel-before-after').innerHTML = md(travel.before_after);
      document.getElementById('share-info-text').innerHTML = md(travel.share_info_text);
      document.getElementById('address-btn').href = travel.address_url;

      /* Story */
      document.getElementById('story-content').innerHTML = md(story.text);

      /* Gallery */
      var galleryHTML = '';
      gallery.photos.forEach(function(item) {
        galleryHTML += '<div class="gallery-item" data-full="' + item.image + '">' +
          '<img src="' + item.image + '" alt="' + item.caption + '" loading="lazy" onerror="this.parentElement.style.display=\'none\'">' +
          '<div class="caption">' + item.caption + '</div></div>';
      });
      document.getElementById('gallery-grid').innerHTML = galleryHTML;

      /* FAQs */
      var faqHTML = '';
      faqs.items.forEach(function(item) {
        faqHTML += '<div class="faq-item">' +
          '<div class="faq-question">' + item.question + '</div>' +
          '<div class="faq-answer">' + md(item.answer) + '</div></div>';
      });
      document.getElementById('faq-list').innerHTML = faqHTML;

      /* ── Bind interactive features after content loads ── */

      /* Hide broken images */
      document.querySelectorAll('img').forEach(function(img) {
        img.addEventListener('error', function() { this.style.display = 'none'; });
      });

      /* FAQ Accordion */
      document.querySelectorAll('.faq-question').forEach(function(q) {
        q.addEventListener('click', function() {
          this.parentElement.classList.toggle('open');
        });
      });

      /* Photo Lightbox */
      var lightbox = document.getElementById('lightbox');
      var lightboxImg = lightbox.querySelector('img');

      document.querySelectorAll('.gallery-item').forEach(function(item) {
        item.addEventListener('click', function() {
          lightboxImg.src = this.getAttribute('data-full');
          lightboxImg.alt = this.querySelector('img').alt;
          lightbox.classList.add('open');
        });
      });

      lightbox.addEventListener('click', function() {
        lightbox.classList.remove('open');
        lightboxImg.src = '';
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) {
          lightbox.classList.remove('open');
          lightboxImg.src = '';
        }
      });

      /* Fade-in animations */
      var fadeObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.fade-in').forEach(function(el) {
        fadeObserver.observe(el);
      });
    });

    /* ── Scroll Effects (don't depend on JSON) ── */
    var sections = document.querySelectorAll('.section');
    var navLinks = document.querySelectorAll('nav a');

    var navObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var id = entry.target.id;
          navLinks.forEach(function(link) {
            link.classList.toggle('active', link.getAttribute('href') === '#' + id);
          });
        }
      });
    }, { rootMargin: '-50% 0px -50% 0px' });

    sections.forEach(function(section) {
      navObserver.observe(section);
    });

    var hero = document.getElementById('hero');
    if (hero) navObserver.observe(hero);
  </script>
</body>
</html>

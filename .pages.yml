media:
  input: assets
  output: /assets
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: hero
    label: Hero & Footer
    type: file
    path: content/hero.json
    fields:
      - name: title
        label: Title
        type: string
      - name: subtitle
        label: Subtitle
        type: string
      - name: image
        label: Background Image
        type: image
      - name: footer_text
        label: Footer Text
        type: string

  - name: welcome
    label: Welcome
    type: file
    path: content/welcome.json
    fields:
      - name: intro
        label: Intro Text
        type: rich-text
      - name: photo
        label: Couple Photo
        type: image
      - name: details
        label: Details Text
        type: rich-text

  - name: schedule
    label: Schedule
    type: file
    path: content/schedule.json
    fields:
      - name: wedding_date
        label: Wedding Date
        type: string
      - name: venue_name
        label: Venue Name
        type: string
      - name: venue_address
        label: Venue Address
        type: string
      - name: attire_description
        label: Attire Description
        type: rich-text
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - name: time
            label: Time
            type: string
          - name: description
            label: Description
            type: rich-text

  - name: travel
    label: Travel
    type: file
    path: content/travel.json
    fields:
      - name: lodging_name
        label: Lodging Name
        type: string
      - name: lodging_address
        label: Lodging Address
        type: string
      - name: lodging_phone
        label: Lodging Phone
        type: string
      - name: before_after
        label: Before & After Wedding
        type: rich-text
      - name: share_info_text
        label: Share Info Text
        type: rich-text
      - name: address_url
        label: Address Collection URL
        type: string

  - name: story
    label: Our Story
    type: file
    path: content/story.json
    fields:
      - name: text
        label: Story
        type: rich-text

  - name: gallery
    label: Gallery
    type: file
    path: content/gallery.json
    fields:
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
          - name: caption
            label: Caption
            type: string

  - name: faqs
    label: FAQs
    type: file
    path: content/faqs.json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: rich-text
